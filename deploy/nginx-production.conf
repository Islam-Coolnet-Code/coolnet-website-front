# Reference nginx config for the PM2 deployment (no Docker).
#
# The server's real config is not in this repo — apply the two blocks below and
# the /api/ location settings to whatever lives in /etc/nginx/sites-available/
# (or /etc/nginx/conf.d/). The `upstream` and `map` blocks are http-level, so put
# them OUTSIDE the `server { }` block — either at the top of the same file or in
# /etc/nginx/conf.d/coolnet-upstream.conf.
#
# WHY: without `keepalive` below — and especially with `Connection: upgrade`
# hardcoded on non-WebSocket requests — nginx opens a brand new TCP connection
# for every API call. Under a traffic burst those pile up in TIME_WAIT, the host
# runs short of ephemeral ports, and requests start failing with 502/504.

upstream coolnet_api {
    server 127.0.0.1:3001;

    keepalive 64;            # idle connections kept per worker
    keepalive_requests 1000; # requests before a pooled connection is recycled
    keepalive_timeout 60s;   # MUST stay below the API's server.keepAliveTimeout (75s)
}

# `Connection: upgrade` is only valid for a real WebSocket handshake. On a normal
# request it must be empty — sending "upgrade" (or "close") defeats the pool.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 443 ssl http2;
    server_name portal.jet.net.il;

    # ssl_certificate     /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    root /var/www/coolnet/dist;   # the built SPA (npm run build output)
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    location /api/ {
        proxy_pass http://coolnet_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Fail fast if the API is down rather than pinning a worker for 60s.
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Retry once when a pooled connection turns out to be stale. nginx never
        # replays POST/PATCH unless `non_idempotent` is listed, so orders and
        # logins cannot be double-submitted by this.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;

        client_max_body_size 100m;
    }

    location /uploads/ {
        proxy_pass http://coolnet_api/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location ~* ^(?!/uploads/)(?!/api/).*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

# Also raise the per-worker connection cap in /etc/nginx/nginx.conf — each
# proxied request consumes two slots (client + upstream), so the stock 1024 is
# reached sooner than it looks:
#
#   events {
#       worker_connections 4096;
#   }
#
# Then: sudo nginx -t && sudo systemctl reload nginx
