# Backend connection pool. Without `keepalive` nginx opens a fresh TCP connection
# for every single API call, so a traffic burst floods the host with TIME_WAIT
# sockets and starts failing with 502s once ephemeral ports run short.
upstream coolnet_api {
    server api:3001;

    keepalive 64;            # idle connections kept per worker
    keepalive_requests 1000; # requests before a pooled connection is recycled
    keepalive_timeout 60s;   # must stay BELOW the API's server.keepAliveTimeout
}

# `Connection: upgrade` may only be sent for real WebSocket handshakes. For a
# normal request it must be empty — sending "upgrade" (or "close") on every call
# defeats the pool above and makes nginx renegotiate a connection each time.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://coolnet_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Fail fast if the backend is down rather than pinning a worker for 60s.
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Retry once when a pooled connection turns out to be stale. nginx never
        # replays non-idempotent methods (POST/PATCH) unless `non_idempotent` is
        # listed, so orders and logins are not at risk of double submission.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;

        client_max_body_size 100m;
    }

    # Proxy uploads to backend
    location /uploads/ {
        proxy_pass http://coolnet_api/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Cache static assets (excluding /uploads/ and /api/)
    location ~* ^(?!/uploads/)(?!/api/).*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Handle SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
